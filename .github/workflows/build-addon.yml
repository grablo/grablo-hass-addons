name: build-addon

# Build an add-on image for amd64 + aarch64 and push to GHCR, tagged with the version from <addon>/config.yaml.
# Two add-ons, each with its own version line (one controller source, version numbers per product):
#   grablo/       Grablo IoT Core (Reflex / Studio 1.x)  ghcr.io/grablo/{arch}-addon-grablo        tag v1.29.8, …
#   grablo-spot/  Grablo Spot (2.x)                        ghcr.io/grablo/{arch}-addon-grablo-spot   tag spot-v2.0.0, …
#   - manual run (workflow_dispatch) → rebuilds the chosen add-on's current config.yaml version
# Requires the matching .deb to already be on the CDN (the Dockerfile fetches it at build time):
#   core releases/grablo_<version>_<arch>.deb · spot releases/spot/grablo-spot_<version>_<arch>.deb
#
# Each architecture is a separate single-arch image (HA substitutes {arch} in the
# add-on's `image:` and pulls the matching one). Built with Docker Buildx — the
# home-assistant/builder action was deprecated (last release 2026.02.1).
on:
  push:
    tags: ['v*', 'spot-v*']
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on to build
        type: choice
        options: [grablo, grablo-spot]
        default: grablo

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Each arch builds on its OWN native runner (no QEMU emulation):
    #   amd64   → ubuntu-latest     (x86_64 native)
    #   aarch64 → ubuntu-24.04-arm  (arm64 native, free for public repos)
    # Removes the slow/flaky QEMU arm64 emulation (SIGSEGV, ~80min stalls).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # ★ 베이스는 grablo/build.yaml 의 build_from 과 **같아야 한다** — 이 워크플로는 그 파일을
        #   읽지 않고 여기 값을 BUILD_FROM 으로 넘긴다. 2026-09-22 trixie 전환 때 build.yaml 만
        #   바꾸고 여기를 빠뜨려 CI 가 bullseye 로 빌드해 두 job 이 다 실패했다(apt 404).
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-debian:trixie
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-debian:trixie
    steps:
      - uses: actions/checkout@v6

      # Native runner per arch → QEMU no longer needed.
      - uses: docker/setup-buildx-action@v4

      - name: Read versions
        id: meta
        env:
          INPUT_ADDON: ${{ inputs.addon }}
        run: |
          # Which add-on: tag spot-v* → grablo-spot, tag v* → grablo, manual run → the chosen input.
          case "$GITHUB_REF" in
            refs/tags/spot-v*) addon=grablo-spot ;;
            refs/tags/v*)      addon=grablo ;;
            *)                 addon="${INPUT_ADDON:-grablo}" ;;
          esac
          case "$addon" in
            grablo)      product=core; name="Grablo IoT Core" ;;
            grablo-spot) product=spot; name="Grablo Spot" ;;
            *) echo "unknown add-on: $addon" >&2; exit 1 ;;
          esac
          # image tag = add-on version (config.yaml); deb fetched = controller version (build.yaml)
          v=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' "$addon/config.yaml")
          deb=$(sed -nE 's/^ *GRABLO_VERSION: *"?([^"]+)"?.*/\1/p' "$addon/build.yaml")
          # A tag must name the version it publishes (v1.29.8 ↔ grablo 1.29.8, spot-v2.0.0 ↔ grablo-spot 2.0.0).
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              if [ "${tag#spot-}" != "v$v" ]; then echo "tag $tag does not match $addon/config.yaml version $v" >&2; exit 1; fi ;;
          esac
          echo "addon=$addon" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "add-on: $addon ($product)  |  version: $v  |  controller deb: $deb"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.addon }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            GRABLO_VERSION=${{ steps.meta.outputs.deb }}
            GRABLO_PRODUCT=${{ steps.meta.outputs.product }}
          tags: |
            ghcr.io/grablo/${{ matrix.arch }}-addon-${{ steps.meta.outputs.addon }}:${{ steps.meta.outputs.version }}
            ghcr.io/grablo/${{ matrix.arch }}-addon-${{ steps.meta.outputs.addon }}:latest
          # io.hass.* labels mirror what home-assistant/builder produced, so the
          # Supervisor treats the prebuilt image the same way.
          labels: |
            io.hass.name=${{ steps.meta.outputs.name }}
            io.hass.description=${{ steps.meta.outputs.name }} add-on for Home Assistant
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.url=https://grablo.co
            io.hass.version=${{ steps.meta.outputs.version }}
          push: true
          provenance: false
